name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CI: true

jobs:
    lint:
        name: Types, lint, format, catalogs & docs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run format:check
            - run: bun run i18n:check
            - run: bun run check:bridge
            - run: bun run docs:build

    unit-tests:
        name: Unit tests (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - run: bun install --frozen-lockfile
            - run: bun run test

    component-tests:
        name: Components (${{ matrix.browser }})
        runs-on: ubuntu-latest
        # Keep the image version in sync with Playwright in bun.lock.
        container: &playwright-container
            image: mcr.microsoft.com/playwright:v1.65.1-noble
            options: --user 1001
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            # The Playwright image does not include unzip for setup-bun.
            - &install-container-bun
              name: Install Bun
              run: |
                  prefix="$RUNNER_TEMP/kalendus-bun"
                  npm install --global --prefix "$prefix" --no-audit --no-fund bun@1.4.5
                  "$prefix/bin/bun" --version
                  echo "$prefix/bin" >> "$GITHUB_PATH"
            # Browser checks use the root toolchain, not the server's native SQLite addon.
            - &install-browser-deps
              name: Install root workspace dependencies
              run: bun install --frozen-lockfile --filter './'
            - run: bun run test:components
              env:
                  TEST_BROWSERS: ${{ matrix.browser }}
            - run: bun run test:bridge
              env:
                  TEST_BROWSERS: ${{ matrix.browser }}
            - run: bun run test:bridge:inline
              env:
                  TEST_BROWSERS: ${{ matrix.browser }}
            - run: bun run --cwd server test:browser
              env:
                  TEST_BROWSERS: ${{ matrix.browser }}

    storybook-e2e:
        name: Storybook & production E2E (Chromium)
        runs-on: ubuntu-latest
        container: *playwright-container
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - *install-container-bun
            - *install-browser-deps
            - run: bun run test-storybook
            # playwright.config.ts owns production build/start/cleanup.
            - run: bun run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-failures
                  path: test-results/

    server:
        name: Server, authorization & installed migrations
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            - run: bun run --cwd server typecheck
            - run: bun run --cwd server lint
            - run: bun run --cwd server test
            - run: bun run --cwd server build
            - run: bun run --cwd server test:package

    dependency-audit:
        name: Production dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            # Audit the checked-in workspace lockfile without installing dependencies.
            - run: bun run audit:production
            - name: Capture full dependency advisories for triage
              if: ${{ !cancelled() }}
              run: bun audit --json > dependency-audit.json
              continue-on-error: true
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: dependency-audit
                  path: dependency-audit.json

    build:
        name: Packages & size budgets
        runs-on: ubuntu-latest
        container: *playwright-container
        needs: [lint, unit-tests, component-tests, storybook-e2e, server, dependency-audit]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - *install-container-bun
            - *install-browser-deps
            - run: bun run build:all
            - run: bun run analyze
            - name: Packed consumers (Chromium, locked peers)
              run: bun run test:package
            - name: Packed consumers (Chromium, minimum peers)
              run: bun run test:package --minimum-peers
            - run: bun run checksize
